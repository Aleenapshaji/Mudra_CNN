<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mudra CNN</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #111827;
            --panel-2: #1f2937;
            --primary: #22c55e;
            --primary-dark: #16a34a;
            --text: #e5e7eb;
            --muted: #9ca3af;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #020817, #111827 50%, #0f172a);
            color: var(--text);
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 20px 60px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;
            font-size: clamp(2rem, 4vw, 3rem);
            color: #f8fafc;
        }

        .header p {
            color: var(--muted);
            margin-top: 10px;
            font-size: 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }

        .card {
            background: rgba(17, 24, 39, 0.84);
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 1.4rem;
        }

        .upload-box {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            background: #0f172a;
            border: 1px solid #374151;
            color: var(--text);
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .primary-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #052e16;
        }

        .primary-btn:hover {
            transform: translateY(-1px);
        }

        .preview {
            margin-top: 20px;
            text-align: center;
        }

        .preview img, .preview canvas {
            width: 100%;
            max-height: 320px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.3);
            background: #020817;
        }

        .status {
            padding: 12px 14px;
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 10px;
            color: #bbf7d0;
            display: none;
        }

        .status.error {
            background: rgba(239, 68, 68, 0.08);
            border-color: rgba(239, 68, 68, 0.3);
            color: #fecaca;
        }

        .result {
            margin-top: 18px;
            background: rgba(15, 118, 110, 0.12);
            border: 1px solid rgba(45, 212, 191, 0.25);
            border-radius: 10px;
            padding: 14px;
        }

        .result h3 {
            margin: 0 0 10px;
            font-size: 1.1rem;
        }

        .result .gesture {
            font-size: 1.6rem;
            font-weight: 700;
            color: #a7f3d0;
        }

        .result .confidence {
            margin-top: 8px;
            color: var(--muted);
        }

        .webcam-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .webcam-wrapper img {
            width: 100%;
            max-height: 420px;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.35);
            background: #020817;
        }

        .meta {
            margin-top: 18px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .pill {
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.09);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: var(--text);
            font-size: 0.9rem;
        }

        @media (max-width: 640px) {
            .container {
                padding-top: 20px;
            }
            .card {
                padding: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Mudra CNN</h1>
            <p>Hand gesture recognition web application</p>
        </div>

        <div class="grid">
            <div class="card">
                <h2>Upload Image</h2>
                <div class="upload-box">
                    <input type="file" id="imageInput" accept="image/*">
                    <button class="primary-btn" id="predictBtn">Predict Gesture</button>
                </div>

                <div class="preview">
                    <img id="selectedImage" alt="Selected preview" style="display:none;">
                </div>

                <div id="uploadStatus" class="status"></div>

                <div id="resultBox" class="result" style="display:none;">
                    <h3>Prediction</h3>
                    <div class="gesture" id="gestureName">-</div>
                    <div class="confidence" id="gestureConfidence">Confidence: -</div>
                </div>
            </div>

            <div class="card">
                <h2>Live Webcam</h2>
                <div class="webcam-wrapper">
                    <img src="/api/webcam" alt="Webcam preview">
                </div>
                <div class="meta">
                    <span class="pill">Model Status: <span id="modelStatus">Checking...</span></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const modelStatus = document.getElementById('modelStatus');
        const imageInput = document.getElementById('imageInput');
        const selectedImage = document.getElementById('selectedImage');
        const uploadStatus = document.getElementById('uploadStatus');
        const resultBox = document.getElementById('resultBox');
        const gestureName = document.getElementById('gestureName');
        const gestureConfidence = document.getElementById('gestureConfidence');
        const predictBtn = document.getElementById('predictBtn');

        function showStatus(message, isError = false) {
            uploadStatus.textContent = message;
            uploadStatus.style.display = 'block';
            uploadStatus.classList.toggle('error', isError);
        }

        imageInput.addEventListener('change', function () {
            const file = this.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                selectedImage.src = e.target.result;
                selectedImage.style.display = 'block';
            };
            reader.readAsDataURL(file);
        });

        async function checkStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                const loaded = data.model_loaded ? 'Loaded' : 'Not loaded';
                modelStatus.textContent = loaded;
            } catch (error) {
                modelStatus.textContent = 'Error';
            }
        }

        predictBtn.addEventListener('click', async function () {
            const file = imageInput.files[0];
            if (!file) {
                showStatus('Please select an image first.', true);
                return;
            }

            const formData = new FormData();
            formData.append('image', file);

            try {
                showStatus('Processing image...');
                const response = await fetch('/api/predict', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Prediction failed');
                }

                resultBox.style.display = 'block';
                gestureName.textContent = data.gesture;
                gestureConfidence.textContent = `Confidence: ${(data.confidence * 100).toFixed(2)}%`;
                showStatus('Prediction successful.');
            } catch (error) {
                resultBox.style.display = 'none';
                showStatus(error.message || 'Prediction failed', true);
            }
        });

        checkStatus();
    </script>
</body>
</html>
